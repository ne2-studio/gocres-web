- q: "¿Con qué tipo de proyectos trabajas?"
  a: "Con startups, scaleups, SaaS, consultoras, profesionales y empresas ya consolidadas que quieren dar un salto en percepción. Ya sea crear una marca desde cero o replantear una que ya existe."
- q: "¿Tengo que tener claro lo que necesito antes de empezar?"
  a: "No. De hecho, la primera fase del método está pensada justo para eso: descubrir juntos qué necesita tu proyecto antes de tomar ninguna decisión de diseño."
- q: "¿Cómo suele ser el proceso?"
  a: "Comienza con una conversación. A partir de ahí seguimos cuatro fases: Descubrir, Definir, Construir y Entregar."
- q: "¿Cuánto dura un proyecto?"
  a: "Depende del alcance. Un proyecto de branding suele durar entre 4 y 8 semanas; una web entre 6 y 12. Siempre acordamos un calendario claro antes de empezar."
- q: "¿Trabajáis en remoto?"
  a: "Sí. Colaboro con clientes de toda España, Europa y LATAM. Reuniones estructuradas y comunicación asíncrona diaria."
- q: "¿Qué ocurre cuando termina el proyecto?"
  a: "Entrego un sistema listo para crecer contigo y ofrezco acompañamiento en las siguientes fases si lo necesitas."
