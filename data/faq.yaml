- q: "¿Con qué tipo de proyectos trabajas?"
  a: "Trabajo principalmente con autónomos, pequeñas empresas y startups que quieren crear, renovar o mejorar su marca. No importa tanto el tamaño del proyecto como tener algo que contar y querer darle una identidad que esté a la altura."
- q: "¿Tengo que tener claro lo que necesito antes de empezar?"
  a: "No. De hecho, no espero que llegues sabiendo exactamente qué necesitas. Podemos hablar de tu proyecto, ver en qué punto está y entender juntos qué tiene más sentido trabajar antes de empezar a diseñar."
- q: "¿Cómo suele ser el proceso?"
  a: "Cada proyecto es diferente, pero normalmente empiezo conociendo el proyecto y su contexto, después exploramos diferentes ideas y definimos una dirección. A partir de ahí, desarrollo la identidad, la revisamos juntos y preparo todo para que puedas utilizarla."
- q: "¿Cuánto dura un proyecto?"
  a: "Depende de lo que necesite el proyecto y de lo que vayamos a trabajar. Una identidad visual completa puede requerir más tiempo que un proyecto centrado únicamente en el logotipo. Antes de empezar te explico las fases, los tiempos y qué puedes esperar en cada una."
- q: "¿Trabajáis en remoto?"
  a: "Sí. Trabajo de forma remota, así que puedo trabajar contigo independientemente de dónde estés. La mayor parte del proceso se hace online y mantengo la comunicación contigo durante todo el proyecto."
- q: "¿Qué ocurre cuando termina el proyecto?"
  a: "Cuando terminamos, te dejo todo preparado para que puedas utilizar tu identidad con facilidad: archivos finales, recursos necesarios y las indicaciones que hagan falta para mantenerla coherente. La idea es que no dependas de mí cada vez que necesites utilizar tu marca."
