- t: "Claridad"
  d: "Una marca tiene que saber quién es, qué quiere transmitir, qué ofrece y por qué debería importarle a alguien."
- t: "Estrategia"
  d: "El diseño no debería salir de la nada. Cada decisión tiene que responder a un objetivo y tener un motivo detrás."
- t: "Escucha"
  d: "Cada proyecto es diferente. Por eso, antes de empezar a diseñar, necesito entender tu negocio, tu contexto y lo que quieres conseguir."
- t: "Coherencia"
  d: "Una marca no es solo un logo. Todos sus elementos tienen que funcionar juntos y construir un mismo ecosistema."
- t: "Cuidado"
  d: "Los pequeños detalles también cuentan. La forma de presentar tu marca puede cambiar cómo la perciben tus clientes."
- t: "Contexto"
  d: "No diseño marcas en el vacío. Tengo en cuenta dónde van a vivir, con quién tienen que conectar y cómo van a evolucionar con el tiempo."
